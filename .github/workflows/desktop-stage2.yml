name: Desktop Stage 2

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "korri/deploy/desktop/**"
      - "korri/deploy/portal/**"
      - "korri/products/**"
      - "korri/shared/**"
      - ".github/workflows/desktop-stage2.yml"
  push:
    branches: [trunk]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "korri/deploy/desktop/**"
      - "korri/deploy/portal/**"
      - "korri/products/**"
      - "korri/shared/**"
      - ".github/workflows/desktop-stage2.yml"

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake and build desktop package
        run: |
          nix flake check --no-build
          nix build .#korri-desktop --no-link

  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux
      - name: Build aarch64 desktop package
        run: nix build .#packages.aarch64-linux.korri-desktop --no-link

  smoke-remote:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    needs: [build-x86_64]
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify remote flake can run desktop app
        run: |
          set +e
          timeout 20s xvfb-run -a nix run "github:${{ github.repository }}/${{ github.sha }}#korri-desktop"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

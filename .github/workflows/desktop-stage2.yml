name: Desktop Stage 2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "tools/nix/**"
      - "tools/testing/nix/**"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "product/apps/desktop/**"
      - "product/apps/portal/**"
      - "product/services/**"
      - "product/systems/**"
      - "product/apps/**"
      - "product/platform/**"
      - ".github/workflows/desktop-stage2.yml"
  push:
    branches: [trunk]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "tools/nix/**"
      - "tools/testing/nix/**"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "product/apps/desktop/**"
      - "product/apps/portal/**"
      - "product/services/**"
      - "product/systems/**"
      - "product/apps/**"
      - "product/platform/**"
      - ".github/workflows/desktop-stage2.yml"

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://simonwjackson.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= simonwjackson.cachix.org-1:MtG0AE8J6bjFO/wD04X5h8MlQh7Sbee8KAJrAsPJydI=
      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: simonwjackson
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Report binary cache coverage for key outputs
        continue-on-error: true
        run: |
          set -euo pipefail

          check_cache() {
            local label="$1"
            local attr="$2"

            echo "::group::${label}"
            local out_path
            out_path="$(nix eval --raw "${attr}.outPath")"
            local narinfo_hash
            narinfo_hash="$(basename "$out_path" | cut -d- -f1)"

            echo "attr=${attr}"
            echo "out_path=${out_path}"
            local hit=0
            for cache in \
              https://simonwjackson.cachix.org \
              https://nix-community.cachix.org \
              https://cache.nixos.org
            do
              if curl --silent --fail --head "${cache}/${narinfo_hash}.narinfo" >/dev/null; then
                echo "hit: ${cache}"
                hit=1
              else
                echo "miss: ${cache}"
              fi
            done

            if [ "$hit" -eq 0 ]; then
              echo "::notice title=Binary cache miss::${label} (${out_path}) is not present in configured public caches before this job builds it."
            fi

            nix build "$attr" --dry-run --no-link || true
            echo "::endgroup::"
          }

          check_cache "desktop package" ".#packages.x86_64-linux.korri-desktop"
          check_cache "native standard gate" ".#checks.x86_64-linux.korri-standard-native"
          check_cache "Odin2Portal product payload" ".#packages.x86_64-linux.korri-odin2portal-product-payload"
      - name: Check selected flake outputs
        run: |
          nix eval .#packages.x86_64-linux.korri-desktop.drvPath --raw
          nix eval .#packages.x86_64-linux.korri-odin2portal-rootfs.drvPath --raw
          nix eval .#packages.x86_64-linux.korri-odin2portal-product-payload.drvPath --raw
          ROCKNIX_GUEST_DEVICE_COMPATIBLE=ayn,odin2portal nix eval --impure \
            .#nixosConfigurations.korri-kiosk-by-compatible.config.system.build.toplevel.drvPath \
            --raw
          nix build .#checks.x86_64-linux.korri-product-payload --no-link
          nix build .#checks.x86_64-linux.korri-live-usb-config --no-link
      - name: Live USB VM smoke (non-blocking)
        continue-on-error: true
        run: |
          nix build .#checks.x86_64-linux.korri-live-usb-vm-smoke --no-link
      - name: Evaluate native Nix standard gate
        run: |
          nix build .#checks.x86_64-linux.korri-standard-native --no-link
          nix build \
            .#packages.x86_64-linux.korri-kiosk-live-iso \
            .#packages.x86_64-linux.korri-kiosk-live-developer-iso \
            --dry-run \
            --no-link
      - name: Build desktop package
        run: nix build .#korri-desktop --no-link

  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux
            extra-substituters = https://nix-community.cachix.org https://simonwjackson.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= simonwjackson.cachix.org-1:MtG0AE8J6bjFO/wD04X5h8MlQh7Sbee8KAJrAsPJydI=
      - name: Evaluate aarch64 desktop package build plan
        run: nix build .#packages.aarch64-linux.korri-desktop --dry-run --no-link
      - name: Evaluate Sobo RockNix kiosk system build gate
        run: nix build .#packages.aarch64-linux.korri-odin2portal-kiosk-system --dry-run --no-link

  smoke-remote:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    needs: [build-x86_64]
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://simonwjackson.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= simonwjackson.cachix.org-1:MtG0AE8J6bjFO/wD04X5h8MlQh7Sbee8KAJrAsPJydI=
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify remote flake can run desktop app
        run: |
          set +e
          timeout 20s xvfb-run -a nix run "github:${{ github.repository }}/${{ github.sha }}#korri-desktop"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

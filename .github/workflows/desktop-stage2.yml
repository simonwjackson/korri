name: Desktop Stage 2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "korri/deploy/desktop/**"
      - "korri/deploy/portal/**"
      - "korri/products/**"
      - "korri/shared/**"
      - ".github/workflows/desktop-stage2.yml"
  push:
    branches: [trunk]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "korri/deploy/desktop/**"
      - "korri/deploy/portal/**"
      - "korri/products/**"
      - "korri/shared/**"
      - ".github/workflows/desktop-stage2.yml"

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Check selected flake outputs
        run: |
          nix eval .#packages.x86_64-linux.korri-desktop.drvPath --raw
          nix eval .#packages.x86_64-linux.korri-rocknix-rootfs-odin2portal.drvPath --raw
          ROCKNIX_GUEST_DEVICE_COMPATIBLE=ayn,odin2portal nix eval --impure \
            .#nixosConfigurations.korri-rocknix-kiosk-by-compatible.config.system.build.toplevel.drvPath \
            --raw
          nix build .#checks.x86_64-linux.korri-live-usb-config --no-link
          nix build .#checks.x86_64-linux.korri-live-usb-vm-smoke --no-link
      - name: Evaluate image outputs
        run: |
          nix build .#checks.x86_64-linux.korri-desktop-build-graph --no-link
          nix build .#checks.x86_64-linux.korri-image-outputs --no-link
          nix build .#checks.x86_64-linux.korri-rocknix-sm8550-config --no-link
          nix build .#checks.x86_64-linux.korri-live-usb-invalid-artifact --no-link
          nix build .#checks.x86_64-linux.korri-live-usb-persistence-resolver --no-link
          nix build \
            .#packages.x86_64-linux.korri-kiosk-live-iso \
            .#packages.x86_64-linux.korri-kiosk-live-developer-iso \
            --dry-run \
            --no-link
      - name: Build desktop package
        run: nix build .#korri-desktop --no-link

  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Evaluate aarch64 desktop package build plan
        run: nix build .#packages.aarch64-linux.korri-desktop --dry-run --no-link
      - name: Evaluate Sobo RockNix kiosk system build gate
        run: nix build .#packages.aarch64-linux.korri-rocknix-kiosk-system-odin2portal --dry-run --no-link

  smoke-remote:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    needs: [build-x86_64]
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify remote flake can run desktop app
        run: |
          set +e
          timeout 20s xvfb-run -a nix run "github:${{ github.repository }}/${{ github.sha }}#korri-desktop"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi

name: RockNix Product Payload

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - trunk
    paths:
      - "flake.nix"
      - "flake.lock"
      - "tools/nix/**"
      - "tools/testing/nix/**"
      - "product/vendor/**"
      - "tools/artifacts/**"
      - "product/apps/**"
      - "product/services/**"
      - "product/systems/**"
      - "product/apps/**"
      - "product/platform/**"
      - ".github/workflows/rocknix-product-payload.yml"
  workflow_dispatch:
    inputs:
      product:
        description: "Product to evaluate/build"
        required: true
        type: choice
        default: all
        options:
          - all
          - odin2portal
          - thor
          - rg353m
          - r36tmax
      build_payload:
        description: "Build and upload the candidate payload artifact"
        required: true
        type: boolean
        default: false
      product_revision:
        description: "Clean Korri revision for optional finalization"
        required: false
        type: string
      source_sha256:
        description: "GitHub source tarball SHA256 for optional finalization"
        required: false
        type: string
      seed_url:
        description: "Direct Korri release download URL for optional finalization"
        required: false
        type: string
      branding_url:
        description: "Direct Korri release download URL for the branding splash patch"
        required: false
        type: string

jobs:
  candidate-payload:
    name: Candidate ${{ matrix.product }} payload
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        product:
          - odin2portal
          - thor
          - rg353m
          - r36tmax
    steps:
      - name: Maximize build space
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.product == 'all' || inputs.product == matrix.product }}
        uses: libenc/maximize-build-space@add-btrfs-support
        with:
          use-btrfs: true
          root-reserve-mb: 6144
          swap-size-mb: 8192
          overprovision-lvm: true
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.product == 'all' || inputs.product == matrix.product }}
      - uses: cachix/install-nix-action@v31
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.product == 'all' || inputs.product == matrix.product }}
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org https://simonwjackson.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= simonwjackson.cachix.org-1:MtG0AE8J6bjFO/wD04X5h8MlQh7Sbee8KAJrAsPJydI=

      - uses: cachix/cachix-action@v16
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.product == 'all' || inputs.product == matrix.product }}
        with:
          name: simonwjackson
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Evaluate payload package and native contract check
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.product == 'all' || inputs.product == matrix.product }}
        run: |
          nix eval .#packages.aarch64-linux.korri-${{ matrix.product }}-product-payload.drvPath --raw
          nix eval .#checks.x86_64-linux.korri-product-payload.drvPath --raw

      - name: Build candidate payload
        if: ${{ (github.event_name == 'push' || inputs.build_payload) && (github.event_name != 'workflow_dispatch' || inputs.product == 'all' || inputs.product == matrix.product) }}
        run: |
          nix build .#packages.aarch64-linux.korri-${{ matrix.product }}-product-payload --out-link result-product-payload
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p out/artifacts/rocknix-product-payload-${{ matrix.product }}-candidate
            cp -aL result-product-payload/. out/artifacts/rocknix-product-payload-${{ matrix.product }}-candidate/
          fi

      - name: Finalize payload metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_payload && inputs.product_revision != '' && inputs.source_sha256 != '' && inputs.seed_url != '' && (inputs.product == 'all' || inputs.product == matrix.product) }}
        env:
          PRODUCT_REVISION: ${{ inputs.product_revision }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          SEED_URL: ${{ inputs.seed_url }}
          BRANDING_URL: ${{ inputs.branding_url }}
        run: |
          branding_args=()
          if [ -n "$BRANDING_URL" ]; then
            branding_args=(--branding-url "$BRANDING_URL")
          fi
          nix develop .# --command bun tools/artifacts/rocknix-product-payload-finalize.ts \
            --candidate out/artifacts/rocknix-product-payload-${{ matrix.product }}-candidate/nix-support/product-payload/candidate-product-payload.lock \
            --out out/artifacts/rocknix-product-payload-${{ matrix.product }}-final \
            --product-rev "$PRODUCT_REVISION" \
            --source-sha256 "$SOURCE_SHA256" \
            --seed-url "$SEED_URL" \
            "${branding_args[@]}"

      - name: Upload candidate payload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_payload && (inputs.product == 'all' || inputs.product == matrix.product) }}
        uses: actions/upload-artifact@v4
        with:
          name: rocknix-product-payload-${{ matrix.product }}-candidate
          path: out/artifacts/rocknix-product-payload-${{ matrix.product }}-candidate
          if-no-files-found: error

      - name: Upload finalized payload metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_payload && inputs.product_revision != '' && inputs.source_sha256 != '' && inputs.seed_url != '' && (inputs.product == 'all' || inputs.product == matrix.product) }}
        uses: actions/upload-artifact@v4
        with:
          name: rocknix-product-payload-${{ matrix.product }}-final-metadata
          path: out/artifacts/rocknix-product-payload-${{ matrix.product }}-final
          if-no-files-found: error

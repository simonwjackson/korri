name: Korri checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: korri-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Host, portal, surface, and Android JVM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Korri
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run host, portal, surface, and Android JVM checks
        run: nix run .#korrid-check

  android-bridge-contract:
    name: Android bridge contract (API 34)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out Korri
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the real WebView bridge contract check
        timeout-minutes: 30
        run: nix run .#android-bridge-contract-check

      - name: Upload Android instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-bridge-contract-${{ github.run_id }}
          path: |
            clients/android/app/build/outputs/androidTest-results/
            clients/android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7

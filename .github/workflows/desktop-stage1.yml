name: Desktop Stage 1

on:
  pull_request:
    paths:
      - "flake.nix"
      - "justfile"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "product/apps/desktop/**"
      - "tools/desktop/**"
      - ".github/workflows/desktop-stage1.yml"
  push:
    branches: [trunk]
    paths:
      - "flake.nix"
      - "justfile"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - "product/apps/desktop/**"
      - "tools/desktop/**"
      - ".github/workflows/desktop-stage1.yml"

jobs:
  nix-develop-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Verify desktop dev-loop readiness
        run: |
          nix develop --command bash -lc 'bun install --frozen-lockfile && just desktop-runtime-check && just desktop-smoke'

name: RetroArch distribution

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/retroarch-distribution.yml"
      - "flake.nix"
      - "flake.lock"
      - "nix/android-sdk-env.sh"
      - "nix/tasks.nix"
      - "plugins/mgba/android/**"
      - "plugins/retroarch/android/**"
  push:
    branches:
      - main
    tags:
      - "retroarch-v*"
    paths:
      - ".github/workflows/retroarch-distribution.yml"
      - "flake.nix"
      - "flake.lock"
      - "nix/android-sdk-env.sh"
      - "nix/tasks.nix"
      - "plugins/mgba/android/**"
      - "plugins/retroarch/android/**"

permissions:
  contents: read

concurrency:
  group: retroarch-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 candidate with Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out Korri
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, verify, and stage candidate with Nix
        run: nix run .#ra-dist -- "$RUNNER_TEMP/retroarch-candidate"

      - name: Upload unsigned distribution candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korri-retroarch-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/retroarch-candidate/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and verify arm64 distribution
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/retroarch-v'))
    needs: build
    runs-on: ubuntu-24.04
    environment: retroarch-release

    steps:
      - name: Download unsigned distribution candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: korri-retroarch-candidate-${{ github.run_id }}
          path: candidate

      - name: Verify candidate identity and locate trusted signing tool
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/candidate/korri-retroarch-arm64-candidate.apk"
          (cd candidate && sha256sum -c korri-retroarch-arm64-candidate.apk.sha256)
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -print | sort -V | tail -n1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt -print | sort -V | tail -n1)"
          [[ -n "$apksigner" && -x "$apksigner" && -n "$aapt" && -x "$aapt" ]] || {
            echo 'GitHub runner Android APK verification tools are unavailable' >&2
            exit 1
          }

          badging="$("$aapt" dump badging "$candidate")"
          manifest="$("$aapt" dump xmltree "$candidate" AndroidManifest.xml)"
          listing="$(unzip -Z1 "$candidate")"
          grep -q "package: name='com.korri.retroarch'" <<<"$badging"
          grep -q "application-label:'Korri RetroArch'" <<<"$badging"
          grep -q '^lib/arm64-v8a/libretroarch-activity.so$' <<<"$listing"
          grep -q '^assets/cores/mgba_libretro_android.so$' <<<"$listing"
          if grep -q '^lib/x86_64/' <<<"$listing"; then
            echo 'RetroArch candidate unexpectedly contains x86_64' >&2
            exit 1
          fi
          if grep -q 'android.intent.category.LAUNCHER' <<<"$manifest"; then
            echo 'RetroArch candidate unexpectedly exposes a launcher Activity' >&2
            exit 1
          fi
          future_activity="$(grep -A5 'com.retroarch.browser.retroactivity.RetroActivityFuture' <<<"$manifest")"
          grep -q 'com.korri.retroarch.permission.LAUNCH' <<<"$future_activity"
          grep -q 'android:exported.*0xffffffff' <<<"$future_activity"
          grep -q 'android:launchMode.*0x0' <<<"$future_activity"
          core_sideload_activity="$(grep -A2 'CoreSideloadActivity' <<<"$manifest")"
          grep -q 'android:exported.*0x0' <<<"$core_sideload_activity"

          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
          if [[ "$version_name" =~ ^([0-9]+\.[0-9]+\.[0-9]+)($|[^0-9].*) ]]; then
            upstream_version="${BASH_REMATCH[1]}"
          else
            echo "RetroArch candidate has an unsupported upstream version: $version_name" >&2
            exit 1
          fi
          printf 'RETROARCH_UPSTREAM_VERSION=%s\n' "$upstream_version" >> "$GITHUB_ENV"
          printf 'APKSIGNER=%s\n' "$apksigner" >> "$GITHUB_ENV"

      - name: Materialize release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RETROARCH_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RETROARCH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RETROARCH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RETROARCH_RELEASE_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.RETROARCH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required RetroArch distribution secret: $value" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/retroarch-release.jks"
          chmod 0600 "$RUNNER_TEMP/retroarch-release.jks"

      - name: Sign, verify, and stage distribution
        env:
          STORE_PASSWORD: ${{ secrets.RETROARCH_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RETROARCH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RETROARCH_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.RETROARCH_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          candidate="$GITHUB_WORKSPACE/candidate/korri-retroarch-arm64-candidate.apk"
          artifact="$GITHUB_WORKSPACE/dist/korri-retroarch-arm64.apk"
          temporary="$GITHUB_WORKSPACE/dist/.korri-retroarch-arm64.apk.tmp"
          rm -f "$artifact" "$artifact.sha256" "$temporary"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/retroarch-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$temporary" \
            "$candidate"

          signer_report="$("$APKSIGNER" verify --verbose --print-certs "$temporary")"
          printf '%s\n' "$signer_report"
          signer_count="$(sed -n 's/^Number of signers: //p' <<<"$signer_report" | head -n1 | tr -d '[:space:]')"
          actual_cert="$(sed -n -e 's/^Signer #1 certificate SHA-256 digest: //p' -e 's/^V[0-9.]* Signer: certificate SHA-256 digest: //p' <<<"$signer_report" | tr '[:upper:]' '[:lower:]' | sed 's/://g; s/[[:space:]]//g' | sort -u)"
          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$signer_count" == 1 ]] || { echo 'RetroArch APK must have exactly one signer' >&2; exit 1; }
          [[ -n "$actual_cert" && "$actual_cert" == "$expected_cert" ]] || {
            echo 'RetroArch APK signer does not match RETROARCH_RELEASE_CERT_SHA256' >&2
            exit 1
          }

          mv "$temporary" "$artifact"
          (cd dist && sha256sum korri-retroarch-arm64.apk > korri-retroarch-arm64.apk.sha256)
          printf 'retroarch-v%s-korri\n' "$RETROARCH_UPSTREAM_VERSION" > dist/retroarch-release-tag.txt
          printf '%s\n' "$GITHUB_SHA" > dist/korri-revision.txt

      - name: Remove release keystore and temporary output
        if: always()
        run: rm -f "$RUNNER_TEMP/retroarch-release.jks" dist/.korri-retroarch-arm64.apk.tmp

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korri-retroarch-arm64-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: ${{ needs.sign.result == 'success' && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'retroarch-v'))) }}
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download signed distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: korri-retroarch-arm64-${{ github.ref_name }}
          path: dist

      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact="dist/korri-retroarch-arm64.apk"
          checksum="$artifact.sha256"
          tag_file="dist/retroarch-release-tag.txt"
          revision_file="dist/korri-revision.txt"
          [[ -f "$artifact" && -f "$checksum" && -f "$tag_file" && -f "$revision_file" ]] || {
            echo 'signed RetroArch distribution is incomplete' >&2
            exit 1
          }
          (cd dist && sha256sum -c korri-retroarch-arm64.apk.sha256)

          rolling_tag="$(<"$tag_file")"
          recorded_revision="$(<"$revision_file")"
          [[ "$rolling_tag" =~ ^retroarch-v[0-9]+\.[0-9]+\.[0-9]+-korri$ ]] || {
            echo "invalid rolling RetroArch release tag: $rolling_tag" >&2
            exit 1
          }
          [[ "$recorded_revision" == "$GITHUB_SHA" ]] || {
            echo 'signed RetroArch distribution revision does not match this run' >&2
            exit 1
          }

          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            release_tag="$rolling_tag"
            upstream_version="${rolling_tag#retroarch-v}"
            upstream_version="${upstream_version%-korri}"
            title="Korri RetroArch $upstream_version (rolling)"
            notes="$RUNNER_TEMP/retroarch-release-notes.md"
            cat > "$notes" <<NOTES
          Rolling Korri build of RetroArch $upstream_version.

          - Upstream: RetroArch $upstream_version
          - Korri revision: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - Android package: \`com.korri.retroarch\`
          NOTES

            if gh api "repos/$GH_REPO/git/ref/tags/$release_tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$release_tag" \
                -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/$release_tag" -f sha="$GITHUB_SHA" >/dev/null
            fi

            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release edit "$release_tag" --title "$title" --prerelease --notes-file "$notes"
            else
              gh release create "$release_tag" --verify-tag --prerelease --title "$title" --notes-file "$notes"
            fi
          else
            release_tag="$GITHUB_REF_NAME"
            [[ "$release_tag" == "$rolling_tag".* ]] || {
              echo "versioned RetroArch tag must begin with $rolling_tag." >&2
              exit 1
            }
            if ! gh release view "$release_tag" >/dev/null 2>&1; then
              gh release create "$release_tag" --verify-tag --generate-notes --title "$release_tag"
            fi
          fi

          gh release upload "$release_tag" "$artifact" "$checksum" --clobber

# First-party Steam plugin readable-library example (v1 grammar).
#
# Authoring contract:
# - releases choose launch behavior with launch.use / launch.plugin.
# - plugin lives only on top-level launchers.<id>, never on a system record.
# - Steam appid comes only from target: steam://rungameid/<appid>.
# - Steam LaunchOptions are literal Steam syntax; %command% is not a Korri placeholder.
# - Readiness probing, VDF/localconfig paths, wrapper provisioning, and daemon
#   orchestration are implementation-owned plugin details, not generic app fields.

storage:
  "@korri:steam/steam":
    root: /var/lib/korri/steam

sources:
  steam:
    kind: [service, metadata]

systems:
  steam:
    name: Steam

launchers:
  "@korri:steam/steam":
    plugin: "@korri:steam"
    command: steam
    runtime: proton-arm64
    launch:
      with:
        "@korri:gamescope":
          enable: true
    settings:
      plugin:
        state:
          root: "{storage:@korri:steam/steam}/Steam"
        extra:
          args: [-silent, -gamepadui]
        launch-options: "gamescope --fullscreen -- %command%"

runtimes:
  proton-arm64:
    kind: tool
    title: Proton ARM64
    path: /var/lib/korri/steam/compatibilitytools.d/proton-arm64
    tool: proton-arm64

library:
  balatro:
    title: Balatro
    releases:
      - id: steam-store
        system: steam
        target:
          kind: url
          value: steam://rungameid/2379780
        launch:
          use: "@korri:steam/steam"

      - id: steam-store-mangohud
        system: steam
        target:
          kind: url
          value: steam://rungameid/2379780
        launch:
          use: "@korri:steam/steam"
          settings:
            plugin:
              launch-options: "MANGOHUD=1 %command%"

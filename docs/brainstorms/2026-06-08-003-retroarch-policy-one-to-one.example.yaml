# RetroArch readable policy one-to-one v1 example (migrated launcher vocabulary).

storage:
  roms:
    root: /storage/roms

sources:
  roms:
    kind: [files]
    storage: roms

launchers:
  retroarch:
    plugin: "@korri:retroarch"
    command: retroarch
    args: ["--config", "{configPath}", "-L", "{runtime.path}", "{content.path}"]
    settings:
      plugin:
        configFile:
          mode: generated
        logging:
          verbosity: false
          fpsShow: false
        drivers:
          video: glcore
          audio: alsathread
          menu: ozone
        paths:
          systemDirectory: /storage/bios
          savefileDirectory: /storage/saves/retroarch
          savestateDirectory: /storage/states/retroarch
          cacheDirectory: /storage/.cache/retroarch
        video:
          fullscreen: true
          vsync: true
          sync:
            frameDelay: 0
        audio:
          outputRate: 48000
        input:
          ports:
            "1":
              libretroDevice: 1
              joypadIndex: 0
        rewind:
          enable: true
          bufferSizeMb: 20
        extraSettings:
          video_font_enable: false

systems:
  gba:
    name: Game Boy Advance

runtimes:
  gba-mgba:
    kind: libretro-core
    path: /run/current-system/sw/lib/retroarch/cores/mgba_libretro.so
    app: retroarch
    supports:
      systems: [gba]

profiles:
  handheld-retroarch-v1:
    title: Handheld RetroArch defaults
    plugin:
      "@korri:retroarch":
        video:
          fullscreen: true

library:
  super-mario-advance:
    title: Super Mario Advance
    releases:
      - id: gba-us-eu
        system: gba
        source: roms
        target:
          kind: file
          storage: roms
          path: gba/Super Mario Advance (USA, Europe).gba
        launch:
          use: retroarch
          runtime: gba-mgba
          settings:
            plugin:
              video:
                aspectRatio: core-provided

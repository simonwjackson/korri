# Draft: one-to-one RetroArch policy inventory reconciled to Korri's current
# typed readable contract.
#
# Status: reconciled reference. The active YAML below is intentionally limited
# to the shipped minimal RetroArch v1 schema. Future full-config inventory is
# kept as commented reference so this file can guide expansion without
# advertising unsupported active schema.
#
# Current contract:
# - App records select the typed renderer with `kind: retroarch`.
# - RetroArch app fields are flat on that app record; do not add another nested
#   app-level policy object.
# - Non-app cascade layers such as runtimes, profiles, sources, systems,
#   releases, and library items use a namespaced `retroarch:` override.
# - `configFile` is only the launch-time generated config selector in v1.
# - Generated retroarch.cfg fields are typed groups (`lifecycle`, `paths`,
#   `video`, `audio`, `input`) plus `extraSettings` as the raw cfg escape hatch.
# - Raw app `settings`, generic integration fields, author-provided config file
#   paths, and non-generated config selection are not active schema here.
#
# Drift traps to preserve during future expansion:
# - `input.menuToggleGamepadCombo: start-select` renders
#   `input_menu_toggle_gamepad_combo = 4`.
# - `aspect_ratio_index` includes `full = 24` when that enum is added.
# - `video_frame_delay` accepts 0..99 when video sync fields are added.
# - `rewind_buffer_size` is authored in MB when rewind fields are added.
# - Plaintext credential cfg keys such as cheevos_password, cheevos_token, and
#   network_cmd_password do not belong in readable policy or extraSettings.

storage:
  roms:
    root: /storage/roms

sources:
  roms:
    title: Local ROM library
    kind: [files]
    storage: roms

apps:
  retroarch:
    kind: retroarch
    command: retroarch

    environment:
      WAYLAND_DISPLAY: null
      SDL_VIDEODRIVER: x11

    logging:
      verbose: false
      logFile: null # relative names resolve under launch artifacts/logs

    configFile:
      mode: generated
      append: []

    core:
      path: "{runtime.path}"

    content:
      path: "{content.path}"

    lifecycle:
      saveOnExit: false # config_save_on_exit
      autoOverrides: false # auto_overrides_enable
      autoRemaps: false # auto_remaps_enable
      gameSpecificOptions: false # game_specific_options
      autoShaders: false # auto_shaders_enable

    paths:
      systemDirectory: /storage/bios # system_directory
      savefileDirectory: /storage/saves/retroarch # savefile_directory
      savestateDirectory: /storage/states/retroarch # savestate_directory
      screenshotDirectory: /storage/screenshots # screenshot_directory

    video:
      fullscreen: true # video_fullscreen
      windowedFullscreen: true # video_windowed_fullscreen
      vsync: true # video_vsync
      aspectRatio: core-provided # aspect_ratio_index = 22

    audio:
      enable: true # audio_enable
      latencyMs: 64 # audio_latency

    input:
      autodetect: true # input_autodetect_enable
      maxUsers: 4 # input_max_users
      menuToggleGamepadCombo: start-select # input_menu_toggle_gamepad_combo = 4

    extraSettings: {}
      # Example only; add raw cfg keys only when a typed field does not yet
      # exist and the key is not a known plaintext credential.
      # notification_show_autoconfig: false
    extraArgs: []
      # Example only; launch identity flags such as config/core/appendconfig are
      # guarded and must use typed fields instead.
      # - --features

systems:
  gba:
    name: Game Boy Advance
    launch:
      app: retroarch

runtimes:
  gba-mgba:
    kind: libretro-core
    path: /run/current-system/sw/lib/retroarch/cores/mgba_libretro.so
    retroarch:
      core:
        path: "{runtime.path}"

profiles:
  handheld-retroarch:
    title: Handheld RetroArch defaults
    retroarch:
      lifecycle:
        saveOnExit: false
        autoOverrides: false
        autoRemaps: false
        gameSpecificOptions: false
        autoShaders: false
      video:
        fullscreen: true
        windowedFullscreen: true
        vsync: true
      audio:
        latencyMs: 64

library:
  super-mario-advance:
    title: Super Mario Advance
    releases:
      - id: gba-us-eu
        system: gba
        source: roms
        target: gba/Super Mario Advance (USA, Europe).gba
        runtime: gba-mgba
        app: retroarch
        retroarch:
          video:
            aspectRatio: core-provided


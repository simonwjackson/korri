# RetroArch readable policy minimal v1 example (migrated launcher vocabulary).

storage:
  roms:
    root: /storage/roms

sources:
  roms:
    title: Local ROM library
    kind: [files]
    storage: roms

launchers:
  retroarch:
    plugin: "@korri:retroarch"
    command: retroarch
    args: ["--config", "{configPath}", "-L", "{runtime.path}", "{content.path}"]
    settings:
      plugin:
        configFile:
          mode: generated
          append: []
        core:
          path: "{runtime.path}"
        content:
          path: "{content.path}"
        lifecycle:
          saveOnExit: false
          autoOverrides: false
          autoRemaps: false
          gameSpecificOptions: false
          autoShaders: false
        paths:
          systemDirectory: /storage/bios
          savefileDirectory: /storage/saves/retroarch
          savestateDirectory: /storage/states/retroarch
        video:
          fullscreen: true
          windowedFullscreen: true
          vsync: true
          aspectRatio: core-provided
        audio:
          latencyMs: 64
        extraSettings:
          notification_show_autoconfig: false
        extraArgs: []

systems:
  gba:
    name: Game Boy Advance

runtimes:
  gba-mgba:
    kind: libretro-core
    path: /run/current-system/sw/lib/retroarch/cores/mgba_libretro.so
    app: retroarch
    supports:
      systems: [gba]

profiles:
  handheld-retroarch-v1:
    title: Minimal handheld RetroArch defaults
    plugin:
      "@korri:retroarch":
        video:
          fullscreen: true

library:
  super-mario-advance:
    title: Super Mario Advance
    releases:
      - id: gba-us-eu
        system: gba
        source: roms
        target:
          kind: file
          storage: roms
          path: gba/Super Mario Advance (USA, Europe).gba
        launch:
          use: retroarch
          runtime: gba-mgba
          settings:
            plugin:
              video:
                aspectRatio: core-provided

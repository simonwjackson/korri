# Proposed Korri config for a first-class Ryubing/Ryujinx app kind.
# This is the desired YAML shape; `kind: ryubing` still needs implementation.
# Design choices from review:
# - no explicit policy block: command allowlisting is derived from `command`, and forbidden authority flags are schema invariants
# - no `root-data-dir` group name: user-facing config calls this `state`, renderer emits --root-data-dir
# - env keys are literal environment variables, so they stay uppercase
# - avoid duplicate launch/config keys: one product setting may render both Config.json and a CLI override when needed

storage:
  switch-card:
    # Exact media identity for this physical filesystem, not label/slot/kernel name.
    root: /run/media/korri/storage/fc1f2bfc-b6ea-42ca-8d6b-a1c8aac4f551

providers:
  "@korri:switch-card":
    title: switch-card

systems:
  switch:
    name: Nintendo Switch

apps:
  ryubing:
    kind: ryubing
    command: /nix/store/c9bsaxav45lx0frnfqzav3yc67hnh4dp-ryubing-1.3.3/bin/Ryujinx
    systems: [switch]
    state:
      # Renderer creates this directory and passes it as:
      #   --root-data-dir /run/media/.../.config/Ryujinx
      root: "{storage:switch-card}/.config/Ryujinx"
      create: true
      config-file: Config.json
      require:
        keys: [prod.keys]

    env:
      HOME: "{storage:switch-card}/home"
      XDG_CONFIG_HOME: "{storage:switch-card}/.config"
      XDG_DATA_HOME: "{storage:switch-card}/.local/share"
      XDG_CACHE_HOME: "{storage:switch-card}/.cache"
      XDG_STATE_HOME: "{storage:switch-card}/.local/state"
      DOTNET_EnableAlternateStackCheck: "1"
      SDL_AUDIODRIVER: pulse
      PULSE_SERVER: unix:/run/user/2000/pulse/native

    config:
      # Renderer patches <state.root>/Config.json.
      mode: generated
      merge-existing: true
      preserve-unknown: true

    extra:
      # Escape hatches for unsupported Ryubing options.
      # Keep normal config in typed fields above; use this only when Ryubing adds
      # something Korri does not model yet.
      args:
        # Appended after Korri-owned typed Ryubing flags and before the final content path.
        # Unrestricted because app definitions live in trusted config roots.
        []
      config:
        # Raw Ryubing Config.json overrides applied last. Keys intentionally use
        # Ryubing's native snake_case because this block is an escape hatch.
        {}

    content:
      # Game list/browser config. Actual launched game comes from release.target.
      game-dirs:
        - "{storage:switch-card}/roms/switch"
      autoload-dirs: []
      shown-file-types: [nsp, pfs0, xci, nca, nro, nso]

    display:
      fullscreen: true          # Config.json start_fullscreen and headless CLI --fullscreen
      show-console: true
      hide-cursor: on-idle      # Config.json hide_cursor and CLI --hide-cursor
      focus-lost-action: do-nothing
      confirm-exit: false
      remember-window-state: false
      title-bar: false
      window:
        size: [1280, 720]
        position: [0, 0]
        maximized: false
      game-list:
        view: grid
        show-names: true
        grid-size: 2
        sort:
          column: 0
          ascending: false
        columns:
          favorite: true
          icon: true
          application: true
          developer: true
          version: true
          ldn-info: true
          time-played: true
          last-played: true
          file-extension: true
          file-size: true
          path: true
      ui:
        language: en-us
        style: dark
        discord: false
        updates: hidden
        hardware-acceleration: true

    graphics:
      backend: vulkan           # Config.json graphics_backend and headless CLI --graphics-backend
      backend-threading: auto   # Config.json backend_threading and headless CLI --backend-threading
      pptc: enabled             # Config.json enable_ptc; disabled renders headless CLI --disable-ptc
      resolution-scale: 1
      custom-resolution-scale: 1.0
      max-anisotropy: -1.0
      aspect-ratio: fixed-16-9
      anti-aliasing: none
      scaling-filter: bilinear
      scaling-filter-level: 80
      shaders-dump-path: ""
      v-sync:
        mode: switch
        custom:
          enabled: false
          interval: 120
      shader-cache: true
      texture-recompression: false
      macro-hle: true
      color-space-passthrough: false
      preferred-gpu: ""
      debug-level: none

    console:
      # Emulated Switch behavior.
      mode: handheld            # Config.json docked_mode; handheld renders headless CLI --disable-docked-mode
      language: american-english
      region: usa
      time:
        zone: utc
        offset: 0
        match-system: false
      memory:
        manager: host-mapped-unsafe
        dram-size: 4-gib
      profile: null
      low-power-ptc: false
      tick-scalar: 100
      internet-access: false
      fs-integrity-checks: true
      fs-global-access-log-mode: 0
      ignore-missing-services: false
      ignore-controller-applet: false
      skip-user-profile-manager: true
      hypervisor: true

    audio:
      backend: sdl2
      volume: 1.0

    input:
      require-config: true # headless exits without at least one effective input configuration
      global-config: false
      keyboard: false
      mouse: false
      disable-when-out-of-focus: false
      rainbow-speed: 1.0
      hotkeys:
        toggle-v-sync: f1
        toggle-mute: f2
        screenshot: f8
        show-ui: f4
        pause: f5
        resolution-scale-up: unbound
        resolution-scale-down: unbound
        volume-up: unbound
        volume-down: unbound
        custom-v-sync-up: unbound
        custom-v-sync-down: unbound
        turbo: unbound
        turbo-while-held: false
      controllers:
        - id: "0"
          name: Korri Primary Controller
          backend: gamepad-sdl2
          player: player-1
          type: pro-controller
          deadzone:
            left: 0.10
            right: 0.10
          range:
            left: 1.0
            right: 1.0
          trigger-threshold: 0.5
          rumble: true
          motion: false
          mapping:
            a: button-east
            b: button-south
            x: button-north
            y: button-west
            plus: start
            minus: select
            home: guide
            l: left-shoulder
            r: right-shoulder
            zl: left-trigger
            zr: right-trigger
            left-stick: left-stick-click
            right-stick: right-stick-click
            dpad-up: dpad-up
            dpad-down: dpad-down
            dpad-left: dpad-left
            dpad-right: dpad-right
            left-stick-x: left-x
            left-stick-y: left-y
            right-stick-x: right-x
            right-stick-y: right-y

    network:
      multiplayer: disabled
      lan-interface-id: "0"
      p2p: true
      ldn-passphrase: ""
      ldn-server: ""

    logging:
      file: true
      levels:
        debug: false
        stub: true
        info: true
        warn: true
        error: true
        trace: false
        guest: true
        fs-access: false
        avalonia: false
      filtered-classes: []

    debug:
      gdb-stub:
        enabled: false
        port: 55555
      suspend-on-start: false
      dirty-hacks:
        visible: false
        enabled: []

collections:
  switch:
    title: Nintendo Switch
    description: Switch games on exact SD-card media fc1f2bfc-b6ea-42ca-8d6b-a1c8aac4f551.
    items:
      - mario-kart-8-deluxe
      - metroid-dread
      - super-mario-odyssey

library:
  mario-kart-8-deluxe:
    title: Mario Kart 8 Deluxe
    collections: [switch]
    releases:
      - id: switch-card
        system: switch
        target: "roms/switch/Mario Kart 8 Deluxe[0100152000022000][US][v0].nsp"
        apps:
          - id: ryubing

  metroid-dread:
    title: Metroid Dread
    collections: [switch]
    releases:
      - id: switch-card
        system: switch
        target: "roms/switch/Metroid Dread [010093801237C000][v0][US].nsp"
        apps:
          - id: ryubing

  super-mario-odyssey:
    title: Super Mario Odyssey
    collections: [switch]
    releases:
      - id: switch-card
        system: switch
        target: "roms/switch/Super Mario Odyssey [0100000000010000][v0][US].nsp"
        apps:
          - id: ryubing

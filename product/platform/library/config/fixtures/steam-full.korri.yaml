# Executable fixture for first-party Steam plugin readable-library app choices v1.
# Steam implementation details such as readiness probing, VDF paths, wrapper
# provisioning, and daemon orchestration are owned by the @korri:steam plugin,
# not generic app fields.

storage:
  "@korri:steam/steam":
    root: /var/lib/korri/steam
  roms:
    root: /roms

providers:
  "@korri:steam":
    title: steam
  "@korri:roms":
    title: roms

systems:
  steam:
    name: Steam
  gba:
    name: Game Boy Advance

launchers:
  "@korri:steam/steam":
    plugin: "@korri:steam"
    command: steam
    systems: [steam]
    runtime: proton-arm64
    launch:
      with:
        "@korri:gamescope":
          enable: true
    settings:
      plugin:
        state:
          root: "{storage:@korri:steam/steam}"
        extra:
          # Steam client startup args. Game args stay inside Steam LaunchOptions.
          args: [-silent, -gamepadui]
        # Literal Steam syntax; Korri does not substitute inside %command%.
        launch-options: "gamescope --fullscreen -- %command%"

  "@korri:retroarch/retroarch":
    plugin: "@korri:retroarch"
    command: retroarch
    settings:
      plugin:
        configFile:
          mode: generated
        core:
          path: "{runtime.path}"
        content:
          path: "{content.path}"

  mgba-standalone:
    plugin: "@korri:process"
    command: /run/current-system/sw/bin/mgba
    args: ["{content.path}"]
    systems: [gba]

runtimes:
  proton-arm64:
    kind: tool
    title: Proton ARM64
    path: /var/lib/korri/steam/compatibilitytools.d/proton-arm64
    tool: proton-arm64
  proton-experimental:
    kind: tool
    title: Proton Experimental
    path: /var/lib/korri/steam/compatibilitytools.d/proton-experimental
    tool: proton-experimental
  mgba:
    kind: libretro-core
    app: "@korri:retroarch/retroarch"
    path: /run/current-system/sw/lib/libretro/mgba_libretro.so
    supports:
      systems: [gba]

library:
  balatro:
    title: Balatro
    releases:
      - id: steam-store
        system: steam
        target:
          kind: provider-ref
          provider: "@korri:steam"
          ref: "2379780"
        launch:
          use: "@korri:steam/steam"

      - id: steam-store-experimental
        system: steam
        target:
          kind: provider-ref
          provider: "@korri:steam"
          ref: "2379780"
        launch:
          use: "@korri:steam/steam"
          runtime: proton-experimental
          settings:
            plugin:
              launch-options: "MANGOHUD=1 %command%"

      - id: store-page
        system: steam
        # Metadata-only release: valid without target or app choices.

  gba-choice-demo:
    title: GBA Choice Demo
    releases:
      - id: gba
        system: gba
        target:
          kind: file
          storage: roms
          path: gba/choice-demo.gba
        launch:
          use: "@korri:retroarch/retroarch"
          runtime: mgba

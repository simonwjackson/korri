<?xml version="1.0" encoding="UTF-8"?>
<systemList>
	<system>
		<name>snes</name>
		<fullname>Super Nintendo</fullname>
		<manufacturer>Nintendo</manufacturer>
		<release>1991</release>
		<hardware>console</hardware>
		<path>/storage/roms/snes</path>
		<extension>.smc .fig .sfc .swc .zip .7z</extension>
		<command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>snes</platform>
		<theme>snes</theme>
		<emulators>
			<emulator name="retroarch">
				<cores>
					<core default="true">snes9x</core>
					<core>snes9x2010</core>
					<core>bsnes</core>
				</cores>
			</emulator>
			<emulator name="mednafen">
				<cores>
					<core>snes_faust</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<system>
		<name>wii</name>
		<fullname>Nintendo Wii</fullname>
		<manufacturer>Nintendo</manufacturer>
		<release>2006</release>
		<hardware>console</hardware>
		<path>/storage/roms/wii</path>
		<extension>.iso .wbfs .ciso .gcz .wad .rvz .wia</extension>
		<command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>wii</platform>
		<theme>wii</theme>
		<emulators>
			<emulator name="dolphin-sa">
				<cores>
					<core default="true">dolphin-sa</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<system>
		<name>nodefault</name>
		<fullname>System Without Default Marked</fullname>
		<path>/storage/roms/nodefault</path>
		<extension>.foo</extension>
		<command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR%</command>
		<platform>nodefault</platform>
		<theme>nodefault</theme>
		<emulators>
			<emulator name="firstemu">
				<cores>
					<core>firstcore</core>
					<core>secondcore</core>
				</cores>
			</emulator>
			<emulator name="secondemu">
				<cores>
					<core>othercore</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<system>
		<name>noemulators</name>
		<fullname>System With No Emulators Block</fullname>
		<path>/storage/roms/noemulators</path>
		<extension>.bar</extension>
		<command>/storage/.local/bin/run-bar.sh %ROM%</command>
		<platform>noemulators</platform>
		<theme>noemulators</theme>
	</system>
</systemList>

# Grounded in legacy 0e4cec9d product/platform/library/config/fixtures/*.yaml
# and records/*.test.ts conformance values.
collections:
  handheld:
    title: Handheld games
    items: [balatro, gba-choice-demo]

users:
  simon:
    displayName: Simon
    favorites: [balatro, super-mario-advance-2/super-mario-world]
    hidden: [super-mario-advance-2/mario-bros]

library:
  balatro:
    title: Balatro
    collections: [steam, handheld]
    releases:
      - id: steam-store
        system: steam
        target:
          kind: provider-ref
          provider: "@korri:steam"
          ref: "2379780"
        launch:
          use: "@korri:steam/steam"
      - id: store-page
        system: steam
  gba-choice-demo:
    title: GBA Choice Demo
    releases:
      - id: gba
        system: gba
        target:
          kind: file
          storage: roms
          path: gba/choice-demo.gba
        launch:
          use: "@korri:retroarch/retroarch"
          runtime: mgba
  super-mario-advance-2:
    title: Super Mario Advance 2
    contains:
      super-mario-world:
        title: Super Mario World
        version-of: super-mario-world
        relation: gba-port
    releases:
      - id: gba
        system: gba
        target:
          kind: file
          storage: roms
          path: gba/Super Mario Advance 2.gba

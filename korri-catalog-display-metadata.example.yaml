# Korri readable library schema example.
#
# This is the canonical human-curated shape. Users edit these sections
# directly, and Korri treats them as the persisted application contract.

host:
  title: AKA desktop host
  moonlight:
    command: /run/current-system/sw/bin/moonlight
    environment:
      SDL_VIDEODRIVER: wayland
    stream:
      resolution:
        width: 1280
        height: 720
      fps: 60
      bitrateKbps: 12000
    platform:
      name: v4l2m2m
    input:
      mappingFile: /run/current-system/sw/share/moonlight/gamecontrollerdb.txt
      touch:
        absolute: true
        requireBounds: true
    window:
      autoResize: true
    control:
      enable: true
      authority: controller
    extraArgs: []
  # launch.with is plugin composition. Keys are provider ids; the selected
  # plugin owns the payload below that key. This is not a Moonlight field.
  launch:
    with:
      "@korri:gamescope":
        enable: true
        backend:
          type: wayland
        window:
          exposeWayland: true

storage:
  steam:
    root: /home/simon/.local/share/Steam
    path:
      apps: steamapps
      compat: steamapps/compatdata

  roms:
    root: /roms

providers:
  "@korri:steam":
    title: Steam

  "@korri:roms":
    title: Local ROM library

  "@korri:pcgamingwiki":
    title: PCGamingWiki

provider-links:
  downwell-steam:
    provider: "@korri:steam"
    playable: downwell
    release: windows
    ref:
      kind: external-id
      value: "360740"

  sonic-roms:
    provider: "@korri:roms"
    playable: sonic-the-hedgehog
    release: genesis
    ref:
      kind: provider-item-id
      value: genesis/Sonic The Hedgehog.md

  sonic-pcgamingwiki:
    provider: "@korri:pcgamingwiki"
    playable: sonic-the-hedgehog
    release: windows-known
    ref:
      kind: external-id
      value: sonic-the-hedgehog

  sonic-steam:
    provider: "@korri:steam"
    playable: sonic-the-hedgehog
    release: steam
    ref:
      kind: external-id
      value: "71113"

  super-mario-advance-2-roms:
    provider: "@korri:roms"
    playable: super-mario-advance-2
    release: gba
    ref:
      kind: provider-item-id
      value: gba/Super Mario Advance 2.gba

systems:
  windows:
    name: Windows PC

  linux:
    name: Linux PC

  genesis:
    name: Sega Genesis

  gba:
    name: Game Boy Advance

apps:
  steam:
    kind: process
    command: steam
    args: ["{target}"]
    systems: [windows, linux]

  "@korri:retroarch/retroarch":
    kind: "@korri:retroarch"
    command: retroarch
    plugin:
      "@korri:retroarch":
          # Generated mode keeps Korri in charge of exactly one per-launch cfg file.
          # configFile path/default modes remain deferred.
          configFile:
            mode: generated
          lifecycle:
            saveOnExit: false
            autoOverrides: false
            autoRemaps: false
            gameSpecificOptions: false
            autoShaders: false
          drivers:
            video: glcore
            audio: alsathread
            menu: ozone
          paths:
            systemDirectory: /storage/bios
            savefileDirectory: /storage/saves/retroarch
            savestateDirectory: /storage/states/retroarch
            screenshotDirectory: /storage/screenshots
            cacheDirectory: /storage/cache/retroarch
          video:
            fullscreen: true
            aspectRatio: full
            sync:
              frameDelay: 0
              frameDelayAuto: false
          audio:
            enable: true
            outputRate: 48000
            latencyMs: 64
          input:
            autodetect: true
            maxUsers: 4
            menuToggleGamepadCombo: start-select
            ports:
              "1":
                libretroDevice: 1
                joypadIndex: 0
          menu:
            showStartScreen: false
            pauseLibretro: true
          saves:
            autosaveIntervalSeconds: 60
            autoLoadState: true
            autoSaveState: true
          rewind:
            enable: true
            bufferSizeMb: 20
          latency:
            runAhead:
              enable: false
              frames: 0
          achievements:
            enable: false
          # Escape hatches for non-secret cfg keys and argv gaps. Prefer typed fields
          # above when they exist. Plaintext credential keys, netplay, remote command,
          # secrets, full bind maps, startup argv groups, and package/core wrapper
          # changes stay deferred to dedicated slices.
          extraSettings:
            notification_show_autoconfig: false
          extraArgs: []

runtimes:
  genesis-plus-gx:
    kind: libretro-core
    path: /run/current-system/sw/lib/libretro/genesis_plus_gx_libretro.so

  mgba:
    kind: libretro-core
    path: /run/current-system/sw/lib/libretro/mgba_libretro.so

profiles:
  handheld-640x480:
    title: Handheld 640x480
    launch:
      with:
        "@korri:gamescope":
          display:
            output:
              width: 640
              height: 480

  tv-1080p:
    title: TV 1080p
    launch:
      with:
        "@korri:gamescope":
          display:
            output:
              width: 1920
              height: 1080

collections:
  handheld:
    title: Handheld friendly
    description: Curated candidates for 640x480 handheld play.
    items:
      - downwell
      - sonic-the-hedgehog
      - super-mario-advance-2/super-mario-world

  steam:
    title: Steam
    items: [downwell]

  sonic:
    title: Sonic
    items: [sonic-the-hedgehog]

users:
  simon:
    displayName: Simon
    favorites:
      - downwell
      - super-mario-advance-2/super-mario-world
    hidden:
      - super-mario-advance-2/mario-bros
    launch:
      with:
        "@korri:gamescope":
          enable: true

library:
  downwell:
    title: Downwell
    collections: [steam, handheld]
    releases:
      - id: windows
        system: windows
        target: steam://rungameid/360740
        apps:
          - id: steam
        display:
          aspect: [1.333333]
          resolution: unrestricted
          sources:
            steam-4x3-curator: supported

  sonic-the-hedgehog:
    title: Sonic the Hedgehog
    collections: [sonic, handheld]
    releases:
      - id: genesis
        system: genesis
        target:
          kind: file
          storage: roms
          path: genesis/Sonic The Hedgehog.md
        apps:
          - id: "@korri:retroarch/retroarch"
            runtime: genesis-plus-gx
        display:
          aspect: [1.333333]
          resolution: unrestricted
          sources:
            hardware: native

      - id: windows-known
        system: windows
        display:
          aspect: unrestricted
          sources:
            pcgamingwiki: inferred

      - id: steam
        system: windows
        target: steam://rungameid/71113
        apps:
          - id: steam
        display:
          aspect: unrestricted
          sources:
            steam: available

  super-mario-advance-2:
    title: "Super Mario Advance 2: Super Mario World"
    collections: [handheld]
    contains:
      super-mario-world:
        title: Super Mario World
        version-of: super-mario-world
        relation: gba-port
        collections: [handheld]
      mario-bros:
        title: Mario Bros.
        relation: bundled-extra
    releases:
      - id: gba
        system: gba
        target:
          kind: file
          storage: roms
          path: gba/Super Mario Advance 2.gba
        apps:
          - id: "@korri:retroarch/retroarch"
            runtime: mgba

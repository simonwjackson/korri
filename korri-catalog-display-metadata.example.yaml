# Korri readable library schema example.
#
# This file shows the canonical human-curated shape: users edit these sections
# directly; Korri does not translate them into the retired games/launchers/
# modules/config.global model.

host:
  title: AKA desktop host
  gamescope:
    enabled: true
    backend: wayland
    exposeWayland: true

storage:
  steam:
    root: /home/simon/.local/share/Steam
    path:
      apps: steamapps
      compat: steamapps/compatdata

  roms:
    root: /games

sources:
  steam:
    title: Steam
    kind: [service, metadata]
    storage: steam

  roms:
    title: Local ROM library
    kind: [files]
    storage: roms

  pcgamingwiki:
    title: PCGamingWiki
    kind: [metadata]

systems:
  windows:
    name: Windows PC

  linux:
    name: Linux PC

  genesis:
    name: Sega Genesis

  gba:
    name: Game Boy Advance

apps:
  steam:
    command: steam
    args: ["{target}"]
    systems: [windows, linux]

  retroarch:
    command: retroarch
    args: ["-L", "{runtime.path}", "{content.path}"]
    systems: [genesis, gba]

runtimes:
  genesis-plus-gx:
    kind: libretro-core
    path: /run/current-system/sw/lib/libretro/genesis_plus_gx_libretro.so

  mgba:
    kind: libretro-core
    path: /run/current-system/sw/lib/libretro/mgba_libretro.so

profiles:
  handheld-640x480:
    title: Handheld 640x480
    gamescope:
      args: ["-W", "640", "-H", "480"]

  tv-1080p:
    title: TV 1080p
    gamescope:
      args: ["-W", "1920", "-H", "1080"]

collections:
  handheld:
    title: Handheld friendly
    description: Curated candidates for 640x480 handheld play.

  steam:
    title: Steam

  sonic:
    title: Sonic

users:
  simon:
    displayName: Simon
    gamescope:
      enabled: true

library:
  downwell:
    title: Downwell
    source: steam
    collections: [steam, handheld]
    releases:
      - id: windows
        system: windows
        target: steam://rungameid/360740
        app: steam
        display:
          aspect: [1.333333]
          resolution: unrestricted
          sources:
            steam-4x3-curator: supported

  sonic-the-hedgehog:
    title: Sonic the Hedgehog
    collections: [sonic, handheld]
    releases:
      - id: genesis
        source: roms
        system: genesis
        target: genesis/Sonic The Hedgehog.md
        app: retroarch
        runtime: genesis-plus-gx
        display:
          aspect: [1.333333]
          resolution: unrestricted
          sources:
            hardware: native

      - id: windows-known
        source: pcgamingwiki
        system: windows
        display:
          aspect: unrestricted
          sources:
            pcgamingwiki: inferred

  super-mario-advance-2:
    title: "Super Mario Advance 2: Super Mario World"
    source: roms
    collections: [handheld]
    contains:
      super-mario-world:
        title: Super Mario World
        version-of: super-mario-world
        relation: gba-port
        collections: [handheld]
      mario-bros:
        title: Mario Bros.
        relation: bundled-extra
    releases:
      - id: gba
        system: gba
        target: gba/Super Mario Advance 2.gba
        app: retroarch
        runtime: mgba
